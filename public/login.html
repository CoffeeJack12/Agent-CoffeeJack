<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in to CoffeeJack</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/auth.css" />
    <script type="module" src="/auth.js"></script>
  </head>
  <body data-page="login">
    <main class="auth-card">
      <div class="brand">CoffeeJack</div>
      <div class="tagline">Local intelligence. Your command.</div>
      <h1>Welcome back</h1>
      <p class="sub">Log in to continue.</p>
      <form id="authForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button id="submit" class="primary" type="submit">Log in</button>
      </form>
      <div id="message" class="message" hidden></div>
      <div class="link-row">No account yet? <a href="/signup">Create one</a></div>
    </main>
  </body>
</html>
