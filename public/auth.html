<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoffeeJack — Your account</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/polish.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <a class="brand" href="/"
        ><span data-jack-slot="logo"></span
        ><span>JACK<small data-i18n="auth.brand">COFFEEJACK</small></span></a
      >
      <h1 id="authTitle" data-i18n="auth.signIn">Sign in</h1>
      <p id="authLead" class="auth-lead" data-i18n="auth.lead.default">A CoffeeJack account — not a Cloudflare account.</p>
      <form id="authForm" class="auth-form" autocomplete="on">
        <label id="nameRow" class="hidden"
          ><span data-i18n="auth.name">Name</span>
          <input name="displayName" maxlength="80" />
        </label>
        <label id="emailRow"
          ><span data-i18n="auth.email">Email</span>
          <input name="email" type="email" autocomplete="username" dir="ltr" />
        </label>
        <label id="passwordRow"
          ><span data-i18n="auth.password">Password</span>
          <input
            name="password"
            type="password"
            required
            minlength="10"
            autocomplete="current-password"
            dir="ltr"
          />
        </label>
        <label id="confirmRow" class="hidden"
          ><span data-i18n="auth.confirmPassword">Confirm password</span>
          <input name="confirmPassword" type="password" minlength="10" dir="ltr" />
        </label>
        <label id="tokenRow" class="hidden"
          ><span id="tokenLabel" data-i18n="auth.code.verify">Email confirmation code</span>
          <input
            name="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]{6}"
            dir="ltr"
          />
        </label>
        <p id="authError" class="auth-error" hidden></p>
        <p id="authNote" class="auth-note" hidden></p>
        <button type="submit" id="authSubmit" data-i18n="auth.submit.login">Sign in</button>
        <button type="button" id="authResend" class="ghost hidden" data-i18n="auth.resend">Resend code</button>
      </form>
      <nav class="auth-links">
        <a href="/login" data-i18n="auth.link.signIn">Sign in</a>
        <a href="/signup" data-i18n="auth.link.create">Create account</a>
        <a href="/forgot" data-i18n="auth.link.forgot">Forgot password</a>
        <a href="/verify" data-i18n="auth.link.verify">Confirm email</a>
      </nav>
    </main>
    <script type="module" src="/auth.js"></script>
  </body>
</html>
