<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create your CoffeeJack account</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/auth.css" />
    <script type="module" src="/auth.js"></script>
  </head>
  <body data-page="signup">
    <main class="auth-card">
      <div class="brand">CoffeeJack</div>
      <div class="tagline">Local intelligence. Your command.</div>
      <h1>Create your account</h1>
      <p class="sub">Sign up to get started. You will confirm your email with a verification code.</p>
      <form id="authForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        <button id="submit" class="primary" type="submit">Create account</button>
      </form>
      <div id="message" class="message" hidden></div>
      <div class="link-row">Already have an account? <a href="/login">Log in</a></div>
    </main>
  </body>
</html>
